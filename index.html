<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Split Log">
<meta name="theme-color" content="#1F5FD6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">Split Log</h1><button class="iconbtn" id="menuBtn" type="button" aria-expanded="false">Backup<span class="due" id="dueDot" hidden> due</span></button></div>

  <section class="sheet" id="menu" hidden>
    <h3>Backup and restore</h3>
    <p id="lastBackup">Your log is stored on this phone only.</p>
    <div class="row"><button class="primary" id="saveFileBtn" type="button">Save backup file</button><button id="openFileBtn" type="button">Restore from file</button></div>
    <p class="small">Save backup opens the share sheet. Choose <b>Save to Files</b>, then pick a folder such as iCloud Drive. Restore lets you pick that file again.</p>
    <input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden>
    <div class="confirmbox" id="confirmBox" hidden>
      <p id="confirmTxt"></p>
      <div class="row"><button class="primary" id="confirmRestore" type="button">Replace with this backup</button><button id="cancelRestore" type="button">Cancel</button></div>
    </div>
    <div class="msg" id="menuMsg" role="status"></div>
    <p class="small">App version <b id="appVer"></b></p>
    <details>
      <summary>More options</summary>
      <div class="more">
        <div class="row"><button id="copyBtn" type="button">Copy backup as text</button></div>
        <textarea id="restoreTxt" placeholder="Paste a text backup here to restore it" aria-label="Backup text to restore"></textarea>
        <div class="row"><button id="restoreBtn" type="button">Restore from pasted text</button><button class="danger" id="resetBtn" type="button">Clear all logged sets</button></div>
        <div class="row"><button id="changePlanBtn" type="button">Change plan</button></div>
      </div>
    </details>
  </section>

  <div class="seg nav" id="nav" role="group" aria-label="Section"><button type="button" data-s="train">Train</button><button type="button" data-s="progress">Progress</button></div>
  <div class="weeks" id="weeks" role="group" aria-label="Week"></div>
  <main id="main" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

<footer>
  <div class="footer-in">
    <div class="timer" id="timer" hidden>
      <span class="lbl" id="timerLbl">Rest</span><span class="t" id="timerT">0:00</span>
      <button class="snd" id="sndBtn" type="button" aria-pressed="true" aria-label="Sound at end of rest"></button>
      <button id="plus15" type="button">+15s</button><button id="skip" type="button">Skip</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Session"></nav>
  </div>
</footer>

<script src="js/logic.js"></script>
<script src="js/state.js"></script>
<script src="js/charts.js"></script>
<script src="js/train.js"></script>
<script src="js/progress.js"></script>
<script src="js/setup.js"></script>
<script src="js/timer.js"></script>
<script src="js/backup.js"></script>
<script src="js/main.js"></script>
</body>
</html>
