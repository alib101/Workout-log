<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five-Day Split</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Split Log">
<meta name="theme-color" content="#1F5FD6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #EDEFEA; --surface: #FFFFFF; --ink: #151A1C; --muted: #5F6B6E; --line: #D5DAD5;
  --field: #F4F5F2; --accent: #1F5FD6; --accent-ink: #FFFFFF; --done: #1B8A57; --done-bg: #E1F3E9; --danger: #C0392B;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1315; --surface: #181E21; --ink: #ECF0EE; --muted: #93A0A3; --line: #2A3337;
    --field: #0F1416; --accent: #6EA2FF; --accent-ink: #0B1220; --done: #4CC98A; --done-bg: #15291F; --danger: #FF7A6B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.35;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(170px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
button { font-family: inherit; color: inherit; font-size: 15px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; }
.iconbtn { min-width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; padding: 0 12px; }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.dayhead h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.dayhead .focus { color: var(--muted); font-size: 14px; }
.dayright { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.count { font-family: var(--font-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.editbtn { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; }
.editbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.banner { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ex h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.target { text-align: right; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.target small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.ref { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.meta .ref { min-width: 0; }
.chartbtn { flex: 0 0 auto; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--field); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chartbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chartbtn[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hintline { font-size: 14px; font-weight: 600; color: var(--done); background: var(--done-bg); border-radius: 8px; padding: 6px 10px; }
.hintline.hold { color: var(--muted); background: var(--field); font-weight: 500; }
.chart { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 4px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.chart .dot.last { fill: var(--accent); }
.chart .val { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.chart .empty { fill: var(--muted); font-size: 13px; font-family: var(--font-body); }
.chart-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 2px 2px; flex-wrap: wrap; }
.chart-cap b { color: var(--ink); font-variant-numeric: tabular-nums; }
.grid-head, .set { display: grid; grid-template-columns: 28px 1fr 1fr 52px; gap: 8px; align-items: center; }
.grid-head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.setn { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--muted); text-align: center; }
input, textarea {
  width: 100%; min-width: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink);
  font-size: 16px; font-family: var(--font-body);
}
.set input { height: 48px; font-family: var(--font-display); font-weight: 600; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
input::placeholder { color: var(--muted); opacity: .55; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
.tick { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); cursor: pointer; display: grid; place-items: center; }
.tick svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.set.done input { background: var(--done-bg); border-color: var(--done); }
.set.done .tick { background: var(--done); border-color: var(--done); }
.set.done .tick svg { stroke: var(--surface); }

/* edit mode */
.ed { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ed label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.ed.four { grid-template-columns: repeat(4, 1fr); }
.ed label.full { grid-column: 1 / -1; }
.ed input { height: 44px; padding: 0 10px; }
.ed-actions { display: flex; gap: 8px; }
.ed-actions button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); font-weight: 600; cursor: pointer; }
.ed-actions .del { color: var(--danger); }
.ed-actions .del.confirm { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.add { height: 52px; border-radius: 14px; border: 2px dashed var(--line); background: transparent; font-weight: 600; color: var(--muted); cursor: pointer; }
.hint { font-size: 13px; color: var(--muted); }
.exnote { font-size: 13px; color: var(--ink); background: var(--field); border-left: 3px solid var(--accent); border-radius: 4px; padding: 6px 10px; }
.planbanner { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.planbanner p { margin: 0; font-size: 14px; color: var(--muted); }
.planbanner .row button.confirm { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pain { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.painrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.painrow label { font-size: 14px; font-weight: 600; }
.painrow input { width: 72px; height: 40px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.paintip { font-size: 13px; color: var(--muted); }
.paintip.mid { color: var(--ink); }
.paintip.high { color: var(--danger); font-weight: 600; }

/* menu sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); }
.sheet textarea { height: 110px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1 1 140px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); font-weight: 600; cursor: pointer; }
.row button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row button.danger { color: var(--danger); }
.row button.danger.confirm { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.msg { font-size: 14px; color: var(--done); min-height: 1.2em; }

footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.footer-in { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.timer { display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
.timer.over { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.timer.over .lbl { color: inherit; }
.timer.over button { background: var(--surface); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .timer.over { animation: pulse 1s ease-in-out 4; } }
@keyframes pulse { 50% { opacity: .55; } }
.timer .snd { min-width: 44px; padding: 0 10px; display: grid; place-items: center; }
.timer .snd svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.timer .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.timer .t { font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; margin-right: auto; }
.timer.over .t { color: inherit; }
.timer button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tab { position: relative; min-height: 52px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px 8px; min-width: 0; }
.tab .n { white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0 !important; text-transform: uppercase; line-height: 1; }
.tab .d { font-size: 11px; color: var(--muted); line-height: 1; }
.tab .bar { position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tab .bar i { display: block; height: 100%; width: 0; background: var(--done); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] .d { color: inherit; opacity: .85; }
.tab[aria-selected="true"] .bar i { background: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Five-Day Split</h1><button class="iconbtn" id="menuBtn" type="button" aria-expanded="false">Backup</button></div>

  <section class="sheet" id="menu" hidden>
    <h3>Backup and restore</h3>
    <p>Your log is stored on this phone only. Copy a backup now and then and paste it into Notes, so you can restore it if you clear Safari data or change phone.</p>
    <div class="row"><button class="primary" id="copyBtn" type="button">Copy backup</button><button id="shareBtn" type="button" hidden>Share backup</button></div>
    <textarea id="restoreTxt" placeholder="Paste a backup here to restore it" aria-label="Backup text to restore"></textarea>
    <div class="row"><button id="restoreBtn" type="button">Restore from pasted text</button><button class="danger" id="resetBtn" type="button">Clear all logged sets</button></div>
    <div class="msg" id="menuMsg" role="status"></div>
  </section>

  <div class="weeks" id="weeks" role="group" aria-label="Week"></div>
  <main id="main" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

<footer>
  <div class="footer-in">
    <div class="timer" id="timer" hidden>
      <span class="lbl" id="timerLbl">Rest</span><span class="t" id="timerT">0:00</span>
      <button class="snd" id="sndBtn" type="button" aria-pressed="true" aria-label="Sound at end of rest"></button>
      <button id="plus15" type="button">+15s</button><button id="skip" type="button">Skip</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Session"></nav>
  </div>
</footer>

<script>
(function () {
  "use strict";
  // [name, sets, reps, rest, add-kg step, form note]. Built around a recovering lower back:
  // no loaded twisting or bending forward, supported positions, core work that resists movement.
  var PLAN_VERSION = 2;
  var DEFAULT_PLAN = [
    { key: "push", name: "Push", day: 1, focus: "Chest, shoulders, triceps", ex: [
      ["Chest press", 3, "8-10", "2 min", 2.5, ""],
      ["Incline bench press machine", 3, "8-10", "2 min", 2.5, ""],
      ["Cable fly", 3, "12-15", "60-90s", 2.5, ""],
      ["Seated DB shoulder press", 3, "8-10", "2 min", 2, "Backrest upright, back on the pad. Take DBs from the rack, not the floor."],
      ["Cable raise 2 handles", 3, "12-15", "60s", 2.5, ""],
      ["X-cable triceps extensions", 3, "10-12", "60-90s", 2.5, ""],
      ["Overhead tri rope 1 arm", 3, "10-12", "60s", 2.5, "Seated or kneeling, ribs down. Don't arch your lower back."],
      ["Dead bug", 3, "8 /side", "60s", 0, "Replaces the ab bench. Keep your lower back pressed into the floor. Slow."] ] },
    { key: "pull", name: "Pull", day: 2, focus: "Back, rear delts, biceps", ex: [
      ["Chest-supported row machine", 4, "8-10", "2 min", 2.5, "Replaces rack pulls for now. Chest stays on the pad."],
      ["Low row (V-bar or 2 handles)", 3, "10-12", "90s", 2.5, "Was 1-handle. Two hands avoids twisting. Sit tall, don't rock."],
      ["Wide arm pull down", 3, "8-12", "90s", 2.5, ""],
      ["Rope back narrow machine", 3, "10-12", "90s", 2.5, ""],
      ["Upright row", 3, "12-15", "60s", 2.5, "Stop at chest height if your shoulders pinch."],
      ["Machine rear delt fly", 3, "12-15", "60s", 2.5, ""],
      ["Curl machine", 3, "10-12", "60s", 2.5, "Machine rather than standing DBs while your back settles."],
      ["Cable rope hammer curls", 3, "10-12", "60s", 2.5, "Soft knees, brace, no swinging."] ] },
    { key: "lowerA", name: "Lower A", day: 3, focus: "Quads, back-friendly", ex: [
      ["Hack squat (or leg press)", 4, "8-10", "2-3 min", 5, "Replaces barbell squat. Leave 2-3 reps in reserve. Stop before your hips tuck under."],
      ["Leg press", 3, "10-12", "2 min", 5, "Stop before your lower back lifts off the pad."],
      ["Leg extensions", 3, "12-15", "60-90s", 2.5, ""],
      ["Lying leg curl", 3, "10-12", "60-90s", 2.5, ""],
      ["Split lunges (DBs)", 3, "8-10 /leg", "90s", 2, "Upright torso. Pick DBs up from the rack, not the floor."],
      ["Seated calf raise", 4, "12-15", "60s", 2.5, ""],
      ["Side plank", 3, "30-45s /side", "60s", 0, "Replaces hanging abs. Straight line from head to heels."] ] },
    { key: "upper", name: "Upper", day: 5, focus: "Chest, back, arms", ex: [
      ["DB incline press", 3, "8-10", "2 min", 2, "Rest the DBs on your knees while seated, then kick them up. No bending down."],
      ["Machine bench press", 3, "8-10", "2 min", 2.5, ""],
      ["Sit down row narrow", 3, "10-12", "90s", 2.5, "Sit tall. Don't lean back to finish the rep."],
      ["Lat pull down curvy bar", 3, "10-12", "90s", 2.5, ""],
      ["Lateral raise", 3, "12-15", "60s", 1, ""],
      ["Cable curl bar", 3, "10-12", "60s", 2.5, ""],
      ["Overhead tri 1 arm (seated)", 3, "10-12", "60s", 2.5, "Seated, ribs down."],
      ["Pallof press", 3, "10 /side", "60s", 2.5, "Anti-twist: resist the cable pulling you round. Start light."] ] },
    { key: "lowerB", name: "Lower B", day: 6, focus: "Hips and glutes, back-friendly", ex: [
      ["Hip thrust machine / glute bridge", 4, "8-12", "2 min", 5, "Ribs down, squeeze at the top. Don't arch your back."],
      ["Leg press (feet high)", 3, "10-12", "2 min", 5, "Stop before your lower back lifts off the pad."],
      ["Seated leg curl", 3, "10-12", "60-90s", 2.5, ""],
      ["Bulgarian split squat", 3, "8-10 /leg", "90s", 2, "Upright torso. DBs from the rack or use the Smith machine."],
      ["Leg extensions", 3, "12-15", "60-90s", 2.5, ""],
      ["Calf press on leg press", 4, "12-15", "60s", 5, "Keeps weight off your spine, unlike standing calf raises."],
      ["Bird dog", 3, "8 /side", "60s", 0, "Slow, hips level, hold 2 seconds at full reach."] ] }
  ];
  var WEEKS = ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5", "Wk 6", "Deload"];
  var DELOAD = 6, DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var KEY = "split-log-v2", VIEW_KEY = "split-log-view";

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function freshPlan() {
    return DEFAULT_PLAN.map(function (d) {
      return { key: d.key, name: d.name, day: d.day, focus: d.focus,
        ex: d.ex.map(function (e, i) { return { id: "v" + PLAN_VERSION + d.key + i, name: e[0], sets: e[1], reps: e[2], rest: e[3], inc: e[4] || 2.5, note: e[5] || "" }; }) };
    });
  }

  // state = { plan: [...days], log: { weekIndex: { exId: [[kg, reps, done], ...] } } }
  var state = { plan: freshPlan(), log: {}, pain: {}, planVersion: PLAN_VERSION };
  var view = { week: 0, day: 0, edit: false };
  var openCharts = {};

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (s && Array.isArray(s.plan) && s.plan.length === 5 && s.log) { state = s; if (!state.pain) state.pain = {}; }
    } catch (e) {}
    try {
      var v = JSON.parse(localStorage.getItem(VIEW_KEY) || "null");
      if (v && v.week >= 0 && v.week < WEEKS.length && v.day >= 0 && v.day < 5) { view.week = v.week; view.day = v.day; return; }
    } catch (e) {}
    var today = new Date().getDay();
    state.plan.forEach(function (d, i) { if (d.day === today) view.day = i; });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function saveView() { try { localStorage.setItem(VIEW_KEY, JSON.stringify({ week: view.week, day: view.day })); } catch (e) {} }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }

  function targetSets(w, ex) { var n = Math.max(1, parseInt(ex.sets, 10) || 3); return w === DELOAD ? Math.ceil(n / 2) : n; }
  function lowReps(r) { var m = String(r).match(/\d+/); return m ? m[0] : ""; }
  function restSecs(r) {
    var nums = (String(r).match(/\d+/g) || []).map(Number);
    if (!nums.length) return 90;
    var top = nums[nums.length - 1];
    return /min/i.test(r) ? top * 60 : top;
  }
  function peek(w, id) { var W = state.log[w]; return W && W[id] ? W[id] : null; }
  function sets(w, id, n) {
    var W = state.log[w] || (state.log[w] = {});
    var a = W[id] || (W[id] = []);
    while (a.length < n) a.push(["", "", 0]);
    return a;
  }
  function fmt(n) { return String(Math.round(n * 100) / 100); }

  function topReps(r) { var m = String(r).match(/\d+/g); return m ? +m[m.length - 1] : 0; }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
  function inc(ex) { var n = parseFloat(ex.inc); return n > 0 ? n : 2.5; }

  // Double progression: if every set last week reached the top of the rep range, add weight.
  function progression(w, ex) {
    if (w === 0 || w === DELOAD) return null;
    var n = targetSets(w - 1, ex), p = peek(w - 1, ex.id);
    if (!p) return null;

    var txt = JSON.stringify(state);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Backup copied. Paste it into Notes."; },
        function () { $("restoreTxt").value = txt; $("restoreTxt").select(); msg.textContent = "Select all in the box and copy it."; });
    } else { $("restoreTxt").value = txt; $("restoreTxt").select(); msg.textContent = "Select all in the box and copy it."; }
  };
  if (navigator.share) {
    $("shareBtn").hidden = false;
    $("shareBtn").onclick = function () {
      navigator.share({ title: "Split log backup", text: JSON.stringify(state) }).catch(function () {});
    };
  }
  $("restoreBtn").onclick = function () {
    try {
      var s = JSON.parse($("restoreTxt").value);
      if (!s || !Array.isArray(s.plan) || !s.log) throw 0;
      state = s; save(); $("restoreTxt").value = ""; renderTabs(); renderMain(); msg.textContent = "Backup restored.";
    } catch (e) { msg.textContent = "That text isn't a backup from this app. Paste the whole backup and try again."; }
  };
  $("resetBtn").onclick = function () {
    var b = this;
    if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = "Tap again to clear sets"; return; }
    state.log = {}; save(); b.classList.remove("confirm"); b.textContent = "Clear all logged sets";
    renderMain(); msg.textContent = "Logged sets cleared. Your exercises are kept.";
  };

  load(); renderWeeks(); renderTabs(); renderMain();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
